<!-- container-fluid = occupa tutta la larghezza dello schermo
     bg-dark = sfondo nero
     text-white = testo bianco
     py-4 = padding verticale (sopra e sotto) di livello 4 per dare spessore alla striscia -->
<footer class="container-fluid bg-dark text-white py-4">
    <!-- row = riga di bootstrap per contenere le colonne -->
    <div class="row">
        <!-- col-12 = la colonna occupa tutti i 12 spazi disponibili (tutta la larghezza)
             text-center = allinea il testo al centro della colonna -->
        <div class="col-12 text-center">
            <!-- mb-0 = margin-bottom 0. Rimuove lo spazio vuoto che Bootstrap mette di default
                 sotto i paragrafi, assicurando che il testo sia perfettamente centrato verticalmente -->
            <p class="mb-0">
                &copy; Elisa Poloni 2026 - Tesi di Laurea Magistrale in Digital Humanities e Patrimonio Culturale - Arti Visive
            </p>
        </div>
    </div>
</footer>
